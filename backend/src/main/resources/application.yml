server:
  port: 8080

spring:
  application:
    name: commerce-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:commerce}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:commerce}
    password: ${MYSQL_PASSWORD:commerce_change_me}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
      id-type: assign_id

# 应用自定义配置（占位，勿提交真实密钥）
app:
  jwt:
    # 生产环境务必用环境变量覆盖；至少 32 字节
    secret: ${JWT_SECRET:请替换为足够长的随机密钥_change_me_32bytes!!}
    expire-seconds: ${JWT_EXPIRE_SECONDS:86400}
  crypto:
    # AES-256 密钥（Base64），仅占位；生产用密钥管理服务注入
    aes-key-base64: ${CRYPTO_AES_KEY_BASE64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin_change_me}
    bucket: ${MINIO_BUCKET:commerce}
  # 1688 / 虾皮官方开放平台凭证占位（真实密钥走环境变量，禁止入库）
  alibaba1688:
    app-key: ${ALIBABA1688_APP_KEY:your_1688_app_key}
    app-secret: ${ALIBABA1688_APP_SECRET:your_1688_app_secret}
    api-base-url: ${ALIBABA1688_API_BASE_URL:https://gw.open.1688.com/openapi}
  shopee:
    partner-id: ${SHOPEE_PARTNER_ID:0}
    partner-key: ${SHOPEE_PARTNER_KEY:your_shopee_partner_key}
    api-base-url: ${SHOPEE_API_BASE_URL:https://partner.shopeemobile.com}
  xxl-job:
    # 一期骨架仅配置说明；执行器接入见 deploy/README
    admin-addresses: ${XXL_JOB_ADMIN:http://127.0.0.1:8088/xxl-job-admin}
    app-name: commerce-executor
    access-token: ${XXL_JOB_ACCESS_TOKEN:default_token_change_me}
  sync:
    # 价库同步 Spring 定时（占位）；生产改走 XXL-JOB
    price-stock-cron: ${PRICE_STOCK_SYNC_CRON:0 0 * * * ?}

logging:
  level:
    com.cenyao.commerce: INFO
    com.baomidou.mybatisplus: WARN
